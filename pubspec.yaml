name: flutter_posts_app
description: "NewsBay — Flutter Posts App Technical Assessment (Type B Digital)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3

  # Stream transformer used for debounce(duration) + switchMap on the
  # search bar's bloc event stream (see PostsBloc).
  rxdart: ^0.28.0

  # Functional error handling (Either<Failure, T>)
  dartz: ^0.10.1

  # Local persistence (session/token)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
